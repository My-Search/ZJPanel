name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zjpanel

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE }}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE }}:dev" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build backend binaries
        env:
          VERSION: ${{ github.ref_name }}
        working-directory: backend
        run: |
          VERSION_NUM="${VERSION#v}"
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build \
              -ldflags "-s -w -X zjpanel/backend/internal/buildinfo.Version=${VERSION_NUM}" \
              -o "../zjpanel-linux-$ARCH" ./cmd/zjpanel
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zjpanel-binaries
          path: zjpanel-linux-*

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zjpanel-binaries
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: zjpanel-linux-*
