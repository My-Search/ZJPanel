<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#141414">
<title>站点维护中</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#141414;color:#e6e6e6;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
.wrap{max-width:560px;padding:32px}
.icon{font-size:64px}
h1{font-size:26px;margin:16px 0 10px}
p{color:#8b95a5;margin:8px 0;line-height:1.7}
.meta{margin-top:24px;font-size:13px;color:#64748b}
@media (prefers-color-scheme: light){body{background:#f0f4f8;color:#2c3e50}p{color:#7f8c9b}.meta{color:#a0aec0}}
</style>
</head>
<body><div class="wrap">
<div class="icon">🛠️</div>
<h1>站点维护中</h1>
<p>{{message}}</p>
<p>域名：{{domain}}</p>
<p class="meta">维护页面由 ZJPanel 渲染 · {{time}}</p>
</div></body>
</html>
