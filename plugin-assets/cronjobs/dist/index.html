<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定时任务</title>
<script>
// 与面板主题联动（iframe 同源）：必须在 head 首帧渲染前同步，否则先亮后暗闪眼。
try {
  const root = document.documentElement;
  const apply = () => {
    const dark = window.parent && window.parent.document.documentElement.getAttribute('data-theme');
    if (dark && root.getAttribute('data-theme') !== dark) root.setAttribute('data-theme', dark);
  };
  apply();
  if (window.parent && window.parent.document && window.parent.document.documentElement) {
    new MutationObserver(apply).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }
  setInterval(apply, 800);
} catch (e) { /* 跨域降级 */ }
</script>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --border: #e5e7eb; --text: #1f1f1f;
    --dim: #6b7280; --primary: #1677ff; --primary-weak: #e6f0ff;
    --green: #52c41a; --red: #ff4d4f; --orange: #fa8c16; --radius: 10px;
  }
  html[data-theme='dark'] {
    --bg: #141414; --card: #1f1f1f; --border: #333; --text: #e6e6e6;
    --dim: #8c8c8c; --primary: #1677ff; --primary-weak: #16243f;
  }
  * { box-sizing: border-box; }
  html[data-theme='dark'] { background: #141414; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.danger { color: var(--red); }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .task-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-name { font-weight: 600; font-size: 15px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--primary-weak); color: var(--primary); }
  .tag.off { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  .task-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 6px; word-break: break-all; }
  table.logs { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.logs th, table.logs td { border-top: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .ok { color: var(--green); } .fail { color: var(--red); } .warn { color: var(--orange); }
  .log-pre { background: #111; color: #0f0; padding: 10px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  input, select { width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 18px; width: 560px; max-width: 100%; max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; align-items: center; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 18px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 20; }
  .cron-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cron-presets .btn { font-size: 11px; padding: 2px 8px; }
  /* 执行状态徽标 / 实时日志 */
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--primary-weak); color: var(--primary); }
  .badge.running::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; animation: blink 1.2s infinite; }
  .badge.success { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .badge.failed { background: transparent; border: 1px solid var(--red); color: var(--red); }
  .badge.timeout { background: transparent; border: 1px solid var(--orange); color: var(--orange); }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .log-modal { width: 900px; }
  .log-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .log-head h3 { margin: 0; font-size: 15px; }
  .log-dur { margin-left: auto; color: var(--dim); font-size: 12px; }
  .log-meta { color: var(--dim); font-size: 12px; margin: 6px 0 10px; word-break: break-all; }
  .log-pre.live { min-height: 260px; max-height: 58vh; margin-top: 0; }
  .log-hint { color: var(--dim); font-size: 12px; margin-right: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>定时任务</h1>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="loadAll()">刷新</button>
      <button class="btn primary" onclick="openEditor()">+ 新建任务</button>
    </div>
  </div>
  <div class="card" style="color:var(--dim);font-size:12px">
    标准 5 段 cron 表达式（分 时 日 月 周），任务随面板启动自动调度；常用预设：<code>*/5 * * * *</code> 每 5 分钟 ·
    <code>0 3 * * *</code> 每天凌晨 3 点 · <code>0 * * * *</code> 每小时整点。
    执行位置可选面板本机或终端已保存的 SSH 主机；绑定 SSH 后命令在该主机上以登录 shell 环境执行（与手动开终端一致）。
    执行中可实时查看输出，完成后自动落历史记录。
  </div>
  <div id="list"></div>
</div>

<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h3 id="editorTitle">新建任务</h3>
    <div class="form-grid">
      <div><label>标识（小写字母/数字/短横线）</label><input id="f_id" placeholder="backup-db"></div>
      <div><label>任务名称</label><input id="f_name" placeholder="数据库备份"></div>
      <div><label>cron 表达式（5 段）</label><input id="f_cron" placeholder="*/30 * * * *">
        <div class="cron-presets">
          <button class="btn" onclick="$('#f_cron').value='*/5 * * * *'">每5分钟</button>
          <button class="btn" onclick="$('#f_cron').value='*/30 * * * *'">每30分钟</button>
          <button class="btn" onclick="$('#f_cron').value='0 * * * *'">每小时</button>
          <button class="btn" onclick="$('#f_cron').value='0 3 * * *'">每天3点</button>
          <button class="btn" onclick="$('#f_cron').value='0 3 * * 1'">每周一3点</button>
        </div>
      </div>
      <div><label>超时（秒，默认 3600）</label><input id="f_timeout" type="number" placeholder="3600"></div>
      <div style="grid-column:1/-1"><label>命令（bash 执行）</label><input id="f_cmd" placeholder="bash /opt/backup/backup.sh"></div>
      <div><label>执行位置</label><select id="f_target"></select></div>
      <div><label>工作目录（可选，SSH 时先 cd 到该目录）</label><input id="f_dir" placeholder="/opt/backup"></div>
      <div><label><input type="checkbox" id="f_enabled" checked style="width:auto"> 启用（保存后立即生效）</label></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="logMask">
  <div class="modal log-modal">
    <div class="log-head">
      <h3 id="logTitle">执行日志</h3>
      <span class="badge" id="logStatus">运行中</span>
      <span class="log-dur" id="logDur"></span>
    </div>
    <div class="log-meta" id="logMeta"></div>
    <pre class="log-pre live" id="logPre"></pre>
    <div class="modal-foot">
      <span class="log-hint" id="logHint"></span>
      <button class="btn" onclick="closeRunLog()">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = (p, opt) => fetch('/api/plugin/cronjobs' + p, opt).then(r => r.json());
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let tasks = [];
let hosts = [];
let activeRuns = [];
let lastActive = [];
let logsCache = {};
let live = null; // 当前实时订阅：{runId, taskId, startedMs, es, pollTimer, pollMode}
const STATUS_TEXT = { running: '运行中', success: '成功', failed: '失败', timeout: '超时' };
function fmtDur(ms) {
  if (ms == null || isNaN(ms) || ms < 0) return '—';
  if (ms < 1000) return Math.round(ms) + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  return m + 'm' + Math.round(s % 60) + 's';
}
function sinceOf(startAt) {
  const d = new Date(String(startAt || '').replace(' ', 'T'));
  return isNaN(d.getTime()) ? Date.now() : d.getTime();
}
function targetLabel(t) {
  if (!t) return '本机';
  const s = String(t);
  if (s.indexOf('ssh:') === 0) return 'SSH · ' + esc(hostLabel(+s.slice(4)));
  return esc(s);
}
function hostLabel(id) {
  const h = hosts.find(x => x.id === id);
  return h ? (h.name || h.host) + '（' + h.username + '@' + h.host + '）' : '主机#' + id + '（已删除）';
}
async function loadAll() {
  const [ts, hs] = await Promise.all([
    api('/tasks'),
    fetch('/api/ssh/hosts').then(r => r.json()).catch(() => []),
  ]);
  tasks = ts || [];
  hosts = Array.isArray(hs) ? hs : [];
  render();
}
function render() {
  const el = $('#list');
  if (!tasks.length) { el.innerHTML = '<div class="empty">还没有任务，点右上角「新建任务」创建第一个</div>'; return; }
  el.innerHTML = tasks.map(t => `
    <div class="card">
      <div class="task-head">
        <span class="task-name">${esc(t.name)}</span>
        <span class="tag ${t.enabled ? '' : 'off'}">${t.enabled ? '启用' : '停用'}</span>
        <span class="tag">${esc(t.id)}</span>
        <span class="badge running" data-task-badge="${esc(t.id)}" style="display:none"></span>
        <div class="task-actions">
          <button class="btn small" onclick="runTask('${esc(t.id)}')">立即执行</button>
          <button class="btn small" onclick="toggleTask('${esc(t.id)}', ${!t.enabled})">${t.enabled ? '停用' : '启用'}</button>
          <button class="btn small" onclick="showLogs('${esc(t.id)}')">日志</button>
          <button class="btn small" onclick="openEditor('${esc(t.id)}')">编辑</button>
          <button class="btn small danger" onclick="delTask('${esc(t.id)}')">删除</button>
        </div>
      </div>
      <div class="meta">表达式：<code>${esc(t.cron)}</code> · 命令：<code>${esc(t.command)}</code>
        · 执行位置：${t.sshHostId ? '<span class="tag">SSH · ' + esc(hostLabel(t.sshHostId)) + '</span>' : '本机'}
        ${t.workDir ? ' · 目录：' + esc(t.workDir) : ''} · 超时：${t.timeout > 0 ? t.timeout + 's' : '3600s'}
        ${t.enabled && t.nextRun ? ' · <span class="ok">下次执行：' + esc(t.nextRun) + '</span>' : ''}</div>
      <div id="logs-${esc(t.id)}"></div>
    </div>`).join('');
  renderTaskBadges();
}
// 卡片头部按任务汇总进行中的执行次数
function renderTaskBadges() {
  const counts = new Map();
  activeRuns.forEach(r => counts.set(r.taskId, (counts.get(r.taskId) || 0) + 1));
  document.querySelectorAll('[data-task-badge]').forEach(el => {
    const n = counts.get(el.dataset.taskBadge) || 0;
    el.style.display = n ? 'inline-block' : 'none';
    el.textContent = n ? (n > 1 ? `进行中 x${n}` : '进行中') : '';
    el.title = n ? '点击「日志」可查看进行中的执行' : '';
  });
}

function openEditor(id) {
  const t = tasks.find(x => x.id === id) || {};
  $('#editorTitle').textContent = id ? '编辑任务 · ' + id : '新建任务';
  $('#f_id').value = t.id || ''; $('#f_id').disabled = !!id;
  $('#f_name').value = t.name || '';
  $('#f_cron').value = t.cron || '';
  $('#f_cmd').value = t.command || '';
  $('#f_dir').value = t.workDir || '';
  $('#f_timeout').value = t.timeout > 0 ? t.timeout : '';
  $('#f_enabled').checked = id ? !!t.enabled : true;
  const sel = $('#f_target');
  sel.innerHTML = '<option value="0">本机（面板执行环境）</option>' +
    hosts.map(h => `<option value="${h.id}">SSH · ${esc(hostLabel(h.id))}</option>`).join('');
  if (t.sshHostId && !hosts.find(h => h.id === t.sshHostId)) {
    sel.innerHTML += `<option value="${t.sshHostId}">${esc(hostLabel(t.sshHostId))}</option>`;
  }
  sel.value = String(t.sshHostId || 0);
  $('#editorMask').classList.add('open');
}
function closeEditor() { $('#editorMask').classList.remove('open'); }

async function saveTask() {
  const body = {
    id: $('#f_id').value.trim(), name: $('#f_name').value.trim(),
    cron: $('#f_cron').value.trim(), command: $('#f_cmd').value.trim(),
    workDir: $('#f_dir').value.trim(), timeout: +$('#f_timeout').value || 0,
    sshHostId: +$('#f_target').value || 0,
    enabled: $('#f_enabled').checked,
  };
  const r = await api('/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.error) { toast(r.error); return; }
  toast('已保存'); closeEditor(); loadAll();
}
async function delTask(id) {
  if (!confirm('删除任务 ' + id + '？')) return;
  await api('/tasks/' + id, { method: 'DELETE' });
  toast('已删除'); loadAll();
}
async function toggleTask(id, enabled) {
  const r = await api('/tasks/' + id + '/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled }) });
  r.error ? toast(r.error) : toast(enabled ? '已启用' : '已停用');
  loadAll();
}
async function runTask(id) {
  const active = activeRuns.find(x => x.taskId === id);
  if (active) { showLogs(id); openLiveRun(active.runId, id, active.startAt, active.target); return; }
  toast('已触发执行');
  const r = await api('/tasks/' + id + '/run', { method: 'POST' });
  if (r.error) { toast('执行失败: ' + r.error); return; }
  pollActive();
  showLogs(id);
  if (r.runId) openLiveRun(r.runId, id, r.startAt, r.target);
}
// 同步进行中执行（仅用于任务卡片徽标和日志列表刷新）
async function pollActive() {
  try {
    const list = await api('/active');
    const prev = lastActive;
    activeRuns = Array.isArray(list) ? list : [];
    lastActive = activeRuns;
    renderTaskBadges();
    prev.forEach(p => {
      if (!activeRuns.some(x => x.runId === p.runId)) {
        const box = $('#logs-' + p.taskId);
        if (box && box.innerHTML.trim()) showLogs(p.taskId);
      }
    });
  } catch (e) { /* 瞬断忽略 */ }
}
async function showLogs(id) {
  const box = $('#logs-' + id);
  if (!box) return;
  const logs = await api('/logs/' + id) || [];
  logsCache[id] = logs;
  if (!logs.length) { box.innerHTML = '<div class="meta">暂无执行记录</div>'; return; }
  box.innerHTML = `
    <table class="logs">
      <tr><th>时间</th><th>目标</th><th>退出码</th><th>耗时</th><th>操作</th></tr>
      ${logs.map((l, i) => {
        const running = l.status === 'running';
        const st = l.status || (l.exitCode === 0 ? 'success' : 'failed');
        return `<tr>
        <td>${esc(l.startAt)}</td>
        <td>${targetLabel(l.target)}</td>
        <td>${running ? '<span class="badge running">运行中</span>' : esc(l.exitCode) + (l.timeout ? ' <span class="warn">超时</span>' : '')}</td>
        <td>${l.durationMs ? fmtDur(l.durationMs) : (l.duration || '—')}</td>
        <td><button class="btn small" onclick="openLogByIndex('${esc(id)}',${i})">${running ? '实时查看' : '查看输出'}</button></td>
      </tr>`;
      }).join('')}
    </table>`;
}
function openLogByIndex(id, i) {
  const l = (logsCache[id] || [])[i];
  if (!l) return;
  if (l.status === 'running') return openLiveRun(l.runId, id, l.startAt, l.target);
  // 历史记录自带 output，直接展示；不再按 runId 回查内存（run 被淘汰后仍能看日志）
  stopLive();
  $('#logMask').classList.add('open');
  setLogHead(id, l.target, l.startAt);
  setLogStatus(l.status || (l.exitCode === 0 ? 'success' : 'failed'), l.exitCode);
  setLogText(l.output || '');
  $('#logDur').textContent = l.durationMs ? '用时 ' + fmtDur(l.durationMs) : (l.duration || '');
  $('#logHint').textContent = '历史输出';
}

// ---- 实时日志弹窗 ----

function setLogHead(taskId, target, startAt) {
  const name = (tasks.find(t => t.id === taskId) || {}).name || taskId;
  $('#logTitle').textContent = '执行日志 · ' + name;
  $('#logMeta').innerHTML = '任务 ' + esc(taskId) + ' · 目标 ' + targetLabel(target) + (startAt ? ' · 开始 ' + esc(startAt) : '');
}
function setLogStatus(status, exitCode) {
  const b = $('#logStatus');
  const cls = status === 'success' ? 'success' : status === 'timeout' ? 'timeout' : status === 'failed' ? 'failed' : 'running';
  b.className = 'badge ' + cls;
  b.textContent = (STATUS_TEXT[status] || '运行中') + (status !== 'running' && exitCode != null && exitCode >= 0 ? ' · exit ' + exitCode : '');
}
function nearBottom(pre) { return pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60; }
function appendLog(text) {
  if (!text) return;
  const pre = $('#logPre');
  const stick = nearBottom(pre);
  pre.appendChild(document.createTextNode(text));
  if (stick) pre.scrollTop = pre.scrollHeight;
}
function setLogText(text) {
  const pre = $('#logPre');
  if (pre.textContent === text) return;
  const stick = nearBottom(pre);
  pre.textContent = text;
  if (stick) pre.scrollTop = pre.scrollHeight;
}

function openLiveRun(runId, taskId, startAt, target) {
  stopLive();
  $('#logMask').classList.add('open');
  $('#logPre').textContent = '';
  setLogHead(taskId, target, startAt);
  setLogStatus('running');
  $('#logHint').textContent = '连接实时输出…';
  live = { runId: runId, taskId: taskId, startedMs: sinceOf(startAt), es: null, pollTimer: null, pollMode: false };
  $('#logDur').textContent = '已运行 ' + fmtDur(Date.now() - live.startedMs);
  connectStream(live);
}
function connectStream(w) {
  if (typeof EventSource === 'undefined') { startPolling(w, '浏览器不支持实时推送，已切换轮询'); return; }
  let es;
  try {
    es = new EventSource('/api/plugin/cronjobs/runs/' + encodeURIComponent(w.runId) + '/stream');
  } catch (e) { startPolling(w, '实时连接创建失败，已切换轮询'); return; }
  w.es = es;
  let got = false;
  const first = setTimeout(() => { if (live === w && !got) startPolling(w, '等待输出，已切换轮询'); }, 4000);
  es.onmessage = (ev) => {
    if (live !== w) { es.close(); return; }
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'out') {
      got = true; clearTimeout(first);
      appendLog((msg.data && msg.data.text) || '');
      $('#logHint').textContent = '实时输出中…';
    } else if (msg.type === 'done') {
      clearTimeout(first);
      try { es.close(); } catch (e) {}
      w.es = null;
      finishLive(w, msg.data || {});
    }
  };
  es.onerror = () => {
    clearTimeout(first);
    if (live === w) startPolling(w);
  };
}
// SSE 不可用（反代缓冲/断开）时降级为 800ms 轮询，接口返回全量输出直接替换
function startPolling(w, hint) {
  if (live !== w || w.pollMode) return;
  w.pollMode = true;
  if (w.es) { try { w.es.close(); } catch (e) {} w.es = null; }
  $('#logHint').textContent = hint || '实时连接中断，已切换轮询';
  const tick = async () => {
    if (live !== w) return;
    try {
      const r = await api('/runs/' + w.runId);
      if (live !== w) return;
      if (r.error) {
        $('#logHint').textContent = r.error;
      } else {
        setLogText(r.output || '');
        if (r.status !== 'running') { finishLive(w, r); return; }
      }
    } catch (e) { /* 下次再试 */ }
    if (live === w) w.pollTimer = setTimeout(tick, 800);
  };
  w.pollTimer = setTimeout(tick, 200);
}
function finishLive(w, info) {
  if (live !== w) return;
  stopLive();
  const st = info.status || 'success';
  setLogStatus(st, info.exitCode);
  $('#logDur').textContent = info.durationMs ? '用时 ' + fmtDur(info.durationMs) : '';
  $('#logHint').textContent = st === 'success' ? '执行完成' : '执行结束（' + (STATUS_TEXT[st] || st) + '）';
  if (w.taskId) showLogs(w.taskId);
  pollActive();
}
function stopLive() {
  if (!live) return;
  if (live.es) { try { live.es.close(); } catch (e) {} }
  if (live.pollTimer) clearTimeout(live.pollTimer);
  live = null;
}
function closeRunLog() { stopLive(); $('#logMask').classList.remove('open'); }

// 每秒刷新实时日志的运行时长
setInterval(() => {
  if (live) $('#logDur').textContent = '已运行 ' + fmtDur(Date.now() - live.startedMs);
}, 1000);
setInterval(pollActive, 2500);
loadAll();
pollActive();
</script>
</body>
</html>
