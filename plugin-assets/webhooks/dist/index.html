<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webhooks 服务</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --border: #e5e7eb; --text: #1f1f1f;
    --dim: #6b7280; --primary: #1677ff; --primary-weak: #e6f0ff;
    --green: #52c41a; --red: #ff4d4f; --orange: #fa8c16; --radius: 10px;
  }
  html[data-theme='dark'] {
    --bg: #141414; --card: #1f1f1f; --border: #333; --text: #e6e6e6;
    --dim: #8c8c8c; --primary: #1677ff; --primary-weak: #16243f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.danger { color: var(--red); }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .hook-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hook-id { font-weight: 600; font-size: 15px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--primary-weak); color: var(--primary); }
  .tag.off { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  .hook-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 6px; word-break: break-all; }
  .url-box { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .url-box code { background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px; word-break: break-all; flex: 1; min-width: 200px; }
  .secret { color: var(--dim); }
  table.logs { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.logs th, table.logs td { border-top: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .ok { color: var(--green); } .fail { color: var(--red); }
  .log-pre { background: #111; color: #0f0; padding: 10px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  input { width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 18px; width: 560px; max-width: 100%; max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 18px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 20; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Webhooks 服务</h1>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="loadAll()">刷新</button>
      <button class="btn primary" onclick="openEditor()">+ 新建 Hook</button>
    </div>
  </div>
  <div class="card" style="color:var(--dim);font-size:12px">
    在 GitHub 仓库 → Settings → Webhooks 中添加 <code style="font-size:11px">application/json</code> POST 到下方接收 URL，Secret 填各 Hook 的密钥；
    推送事件将自动校验 X-Hub-Signature 后执行部署命令。旧 /opt/webhook 服务（9000 端口）可迁移至此。
  </div>
  <div id="list"></div>
</div>

<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h3 id="editorTitle">新建 Hook</h3>
    <div class="form-grid">
      <div><label>ID（URL 标识，小写字母/数字/短横线）</label><input id="f_id" placeholder="agentswork"></div>
      <div><label>通知邮箱（可选）</label><input id="f_mail" placeholder="me@example.com"></div>
      <div style="grid-column:1/-1"><label>项目路径（容器内）</label><input id="f_path" placeholder="/opt/AgentsWorkStudio"></div>
      <div style="grid-column:1/-1"><label>部署命令（bash 执行）</label><input id="f_cmd" placeholder="bash update.sh local"></div>
      <div style="grid-column:1/-1"><label>Secret（留空自动生成；编辑留空沿用旧值）</label><input id="f_secret" placeholder="自动生成"></div>
      <div><label><input type="checkbox" id="f_enabled" checked style="width:auto"> 启用</label></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn primary" onclick="saveHook()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 与面板主题联动（iframe 同源）
try {
  const apply = () => {
    const dark = document.documentElement.closest('html') && window.parent && window.parent.document.documentElement.getAttribute('data-theme');
    if (dark) document.documentElement.setAttribute('data-theme', dark);
  };
  apply();
  setInterval(apply, 800);
} catch (e) { /* 跨域降级 */ }

const $ = (s) => document.querySelector(s);
const api = (p, opt) => fetch('/api/plugin/webhooks' + p, opt).then(r => r.json());
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let hooks = [];
async function loadAll() {
  hooks = await api('/hooks') || [];
  render();
}
function render() {
  const el = $('#list');
  if (!hooks.length) { el.innerHTML = '<div class="empty">还没有 Hook，点右上角「新建 Hook」创建第一个</div>'; return; }
  el.innerHTML = hooks.map(h => `
    <div class="card">
      <div class="hook-head">
        <span class="hook-id">${esc(h.id)}</span>
        <span class="tag ${h.enabled ? '' : 'off'}">${h.enabled ? '启用' : '停用'}</span>
        <div class="hook-actions">
          <button class="btn small" onclick="runHook('${esc(h.id)}')">立即执行</button>
          <button class="btn small" onclick="toggleHook('${esc(h.id)}', ${!h.enabled})">${h.enabled ? '停用' : '启用'}</button>
          <button class="btn small" onclick="showLogs('${esc(h.id)}')">日志</button>
          <button class="btn small" onclick="openEditor('${esc(h.id)}')">编辑</button>
          <button class="btn small danger" onclick="delHook('${esc(h.id)}')">删除</button>
        </div>
      </div>
      <div class="meta">项目：${esc(h.projectPath)} · 命令：${esc(h.deployCmd)} ${h.notifyMail ? '· 通知：' + esc(h.notifyMail) : ''}</div>
      <div class="url-box">
        <code>POST /api/pub/plugin/webhooks/hook/${esc(h.id)}</code>
        <span class="secret">Secret: <code>${esc(h.secret)}</code></span>
        <button class="btn small" onclick="copyText(location.origin+'/api/pub/plugin/webhooks/hook/${esc(h.id)}')">复制 URL</button>
      </div>
      <div id="logs-${esc(h.id)}"></div>
    </div>`).join('');
}
function copyText(t) { navigator.clipboard.writeText(t).then(() => toast('已复制')); }

function openEditor(id) {
  const h = hooks.find(x => x.id === id) || {};
  $('#editorTitle').textContent = id ? '编辑 Hook · ' + id : '新建 Hook';
  $('#f_id').value = h.id || ''; $('#f_id').disabled = !!id;
  $('#f_path').value = h.projectPath || ''; $('#f_cmd').value = h.deployCmd || '';
  $('#f_mail').value = h.notifyMail || ''; $('#f_secret').value = '';
  $('#f_enabled').checked = id ? !!h.enabled : true;
  $('#editorMask').classList.add('open');
}
function closeEditor() { $('#editorMask').classList.remove('open'); }

async function saveHook() {
  const body = {
    id: $('#f_id').value.trim(), projectPath: $('#f_path').value.trim(),
    deployCmd: $('#f_cmd').value.trim(), notifyMail: $('#f_mail').value.trim(),
    secret: $('#f_secret').value.trim(), enabled: $('#f_enabled').checked,
  };
  const r = await api('/hooks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.error) { toast(r.error); return; }
  toast('已保存'); closeEditor(); loadAll();
}
async function delHook(id) {
  if (!confirm('删除 Hook ' + id + '？')) return;
  await api('/hooks/' + id, { method: 'DELETE' });
  toast('已删除'); loadAll();
}
async function toggleHook(id, enabled) {
  const h = hooks.find(x => x.id === id);
  await api('/hooks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...h, enabled }) });
  loadAll();
}
async function runHook(id) {
  toast('已触发执行');
  const r = await api('/hooks/' + id + '/run', { method: 'POST' });
  toast(r.error ? '执行失败: ' + r.error : '执行完成');
  showLogs(id);
}
async function showLogs(id) {
  const box = $('#logs-' + id);
  const logs = await api('/logs/' + id) || [];
  if (!logs.length) { box.innerHTML = '<div class="meta">暂无执行记录</div>'; return; }
  box.innerHTML = `
    <table class="logs">
      <tr><th>时间</th><th>退出码</th><th>操作</th></tr>
      ${logs.map((l, i) => `<tr>
        <td>${esc(l.startAt)}</td>
        <td class="${l.exitCode === 0 ? 'ok' : 'fail'}">${l.exitCode}</td>
        <td><button class="btn small" onclick="toggleLog('${esc(id)}',${i})">查看输出</button></td>
      </tr>`).join('')}
    </table>
    <pre class="log-pre" id="out-${esc(id)}" style="display:none">${esc(logs[0].output)}</pre>`;
}
function toggleLog(id, i) {
  const pre = $('#out-' + id);
  if (pre.style.display === 'none') { pre.style.display = 'block'; }
  else pre.style.display = 'none';
}
loadAll();
</script>
</body>
</html>
