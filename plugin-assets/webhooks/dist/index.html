<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webhooks 服务</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --border: #e5e7eb; --text: #1f1f1f;
    --dim: #6b7280; --primary: #1677ff; --primary-weak: #e6f0ff;
    --green: #52c41a; --red: #ff4d4f; --orange: #fa8c16; --radius: 10px;
  }
  html[data-theme='dark'] {
    --bg: #141414; --card: #1f1f1f; --border: #333; --text: #e6e6e6;
    --dim: #8c8c8c; --primary: #1677ff; --primary-weak: #16243f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.danger { color: var(--red); }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .hook-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hook-id { font-weight: 600; font-size: 15px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--primary-weak); color: var(--primary); }
  .hook-dot { width: 8px; height: 8px; border-radius: 50%; background: #c9cdd4; display: inline-block; flex: none; }
  .hook-dot.on { background: var(--green); box-shadow: 0 0 0 2px rgba(82,196,26,.16); }
  html[data-theme='dark'] .hook-dot { background: #5a5a5a; }
  html[data-theme='dark'] .hook-dot.on { background: var(--green); }
  .hook-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 6px; word-break: break-all; }
  .url-box { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .url-box code { background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px; word-break: break-all; flex: 1; min-width: 200px; }
  .secret { color: var(--dim); }
  .secret-mask { letter-spacing: 1px; user-select: none; }
  table.logs { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.logs th, table.logs td { border-top: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .ok { color: var(--green); } .fail { color: var(--red); }
  .log-pre { background: #111; color: #0f0; padding: 10px; border-radius: 6px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  input, select { width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 18px; width: 560px; max-width: 100%; max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 18px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 20; }

  /* 执行状态徽标 / 实时日志 */
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--primary-weak); color: var(--primary); }
  .badge.running::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; animation: blink 1.2s infinite; }
  .badge.hook-badge::before { display: none; }
  .badge.success { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .badge.failed { background: transparent; border: 1px solid var(--red); color: var(--red); }
  .badge.timeout { background: transparent; border: 1px solid var(--orange); color: var(--orange); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .log-modal { width: 900px; }
  .log-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .log-head h3 { margin: 0; font-size: 15px; }
  .log-dur { margin-left: auto; color: var(--dim); font-size: 12px; }
  .log-meta { color: var(--dim); font-size: 12px; margin: 6px 0 10px; word-break: break-all; }
  .log-pre.live { min-height: 260px; max-height: 58vh; margin-top: 0; }
  .log-hint { color: var(--dim); font-size: 12px; margin-right: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Webhooks 服务</h1>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="loadAll()">刷新</button>
      <button class="btn primary" onclick="openEditor()">+ 新建 Hook</button>
    </div>
  </div>
  <div class="card" style="color:var(--dim);font-size:12px">
    在 GitHub 仓库 → Settings → Webhooks 中添加 <code style="font-size:11px">application/json</code> POST 到下方接收 URL，Secret 填各 Hook 的密钥；
    推送事件将自动校验 X-Hub-Signature 后执行部署命令。旧 /opt/webhook 服务（9000 端口）可迁移至此。
    执行位置可选面板本机或「主机」页里的主机（需已配置 SSH 密码/私钥）；绑定后命令在该主机上以登录 shell 环境执行（与手动开终端一致）。
    执行中可实时查看输出，完成后自动落历史记录。
  </div>
  <div id="list"></div>
</div>

<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h3 id="editorTitle">新建 Hook</h3>
    <div class="form-grid">
      <div><label>ID（URL 标识，小写字母/数字/短横线）</label><input id="f_id" placeholder="agentswork"></div>
      <div><label>通知邮箱（可选）</label><input id="f_mail" placeholder="me@example.com"></div>
      <div style="grid-column:1/-1"><label>项目路径（工作目录：本机为容器内路径；远端主机时为远端路径）</label><input id="f_path" placeholder="/opt/AgentsWorkStudio"></div>
      <div style="grid-column:1/-1"><label>部署命令（bash 执行）</label><input id="f_cmd" placeholder="bash update.sh local"></div>
      <div style="grid-column:1/-1"><label>执行位置（关联主机）</label><select id="f_target"></select></div>
      <div style="grid-column:1/-1"><label>Secret（留空自动生成；编辑留空沿用旧值）</label><input id="f_secret" placeholder="自动生成"></div>
      <div><label><input type="checkbox" id="f_enabled" checked style="width:auto"> 启用</label></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn primary" onclick="saveHook()">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="logMask">
  <div class="modal log-modal">
    <div class="log-head">
      <h3 id="logTitle">执行日志</h3>
      <span class="badge" id="logStatus">运行中</span>
      <span class="log-dur" id="logDur"></span>
    </div>
    <div class="log-meta" id="logMeta"></div>
    <pre class="log-pre live" id="logPre"></pre>
    <div class="modal-foot">
      <span class="log-hint" id="logHint"></span>
      <button class="btn" onclick="closeRunLog()">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 与面板主题联动（iframe 同源）
try {
  const apply = () => {
    const dark = document.documentElement.closest('html') && window.parent && window.parent.document.documentElement.getAttribute('data-theme');
    if (dark) document.documentElement.setAttribute('data-theme', dark);
  };
  apply();
  setInterval(apply, 800);
} catch (e) { /* 跨域降级 */ }

const $ = (s) => document.querySelector(s);
const api = (p, opt) => fetch('/api/plugin/webhooks' + p, opt).then(r => r.json());
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const STATUS_TEXT = { running: '运行中', success: '成功', failed: '失败', timeout: '超时' };
let hooks = [];
let hosts = [];
let allHosts = [];
let activeRuns = [];
let lastActive = [];
let logsCache = {};
let live = null; // 当前实时订阅：{runId, hookId, startedMs, es, pollTimer, pollMode}

function hostLabel(id) {
  const h = hosts.find(x => x.id === id);
  if (h) return (h.name || h.host) + '（' + (h.username || 'root') + '@' + h.host + '）';
  const raw = allHosts.find(x => x.id === id);
  if (!raw) return '主机#' + id + '（已删除）';
  if (raw.local) return '本机（内置主机）';
  return (raw.name || raw.host || ('主机#' + id)) + '（未配置 SSH 凭据）';
}
function targetLabel(t) {
  if (!t) return '本机';
  const s = String(t);
  if (s.indexOf('ssh:') === 0) return '主机 · ' + esc(hostLabel(+s.slice(4)));
  return esc(s);
}
// 执行位置文案：主机可用时展示「主机 · 名称」；失效时给出原因并提供重新关联入口
function targetMeta(id, hookId) {
  if (!id) return '本机';
  if (hosts.find(x => x.id === id)) return '<span class="tag">主机 · ' + esc(hostLabel(id)) + '</span>';
  const raw = allHosts.find(x => x.id === id);
  const why = !raw ? '主机已删除' : raw.local ? '内置本机请直接选「本机」' : '该主机未配置 SSH 凭据';
  return '<span class="warn">关联主机不可用（' + why + '）</span> '
    + '<button class="btn small" onclick="openEditor(\'' + esc(hookId) + '\')">重新关联</button>';
}
function fmtDur(ms) {
  if (ms == null || isNaN(ms) || ms < 0) return '—';
  if (ms < 1000) return Math.round(ms) + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  return m + 'm' + Math.round(s % 60) + 's';
}
function sinceOf(startAt) {
  const d = new Date(String(startAt || '').replace(' ', 'T'));
  return isNaN(d.getTime()) ? Date.now() : d.getTime();
}

async function loadAll() {
  const [hs, sh] = await Promise.all([
    api('/hooks'),
    fetch('/api/hosts').then(r => r.json()).catch(() => []),
  ]);
  hooks = (hs || []).slice().sort((a, b) => (b.enabled ? 1 : 0) - (a.enabled ? 1 : 0));
  allHosts = Array.isArray(sh) ? sh : [];
  // 只有配置了 SSH 密码/私钥的非内置主机才能作为执行目标；内置本机由 value=0 单独表示
  hosts = allHosts.filter(h => !h.local && h.host && h.authType && h.authType !== 'none' && h.authType !== 'local');
  render();
}
function render() {
  const el = $('#list');
  if (!hooks.length) { el.innerHTML = '<div class="empty">还没有 Hook，点右上角「新建 Hook」创建第一个</div>'; return; }
  el.innerHTML = hooks.map(h => `
    <div class="card">
      <div class="hook-head">
        <span class="hook-id">${esc(h.id)}</span>
        <span class="hook-dot ${h.enabled ? 'on' : ''}" title="${h.enabled ? '已启用' : '已停用'}" aria-label="${h.enabled ? '已启用' : '已停用'}"></span>
        <span class="badge running hook-badge" data-hook-badge="${esc(h.id)}" style="display:none"></span>
        <div class="hook-actions">
          <button class="btn small" onclick="runHook('${esc(h.id)}')">立即执行</button>
          <button class="btn small" onclick="toggleHook('${esc(h.id)}', ${!h.enabled})">${h.enabled ? '停用' : '启用'}</button>
          <button class="btn small" onclick="showLogs('${esc(h.id)}')">日志</button>
          <button class="btn small" onclick="openEditor('${esc(h.id)}')">编辑</button>
          <button class="btn small danger" onclick="delHook('${esc(h.id)}')">删除</button>
        </div>
      </div>
      <div class="meta">项目：${esc(h.projectPath)} · 命令：${esc(h.deployCmd)}
        · 执行位置：${targetMeta(h.sshHostId, h.id)}
        ${h.notifyMail ? '· 通知：' + esc(h.notifyMail) : ''}</div>
      <div class="url-box">
        <code>POST /api/pub/plugin/webhooks/hook/${esc(h.id)}</code>
        <span class="secret">Secret: <code class="secret-mask">••••••••••••</code></span>
        <button class="btn small" onclick="copySecret('${esc(h.id)}')">复制 Secret</button>
        <button class="btn small" onclick="copyText(location.origin+'/api/pub/plugin/webhooks/hook/${esc(h.id)}')">复制 URL</button>
      </div>
      <div id="logs-${esc(h.id)}"></div>
    </div>`).join('');
  renderHookBadges();
}
// 卡片头部按 Hook 汇总进行中的执行次数（同一 Hook 可由 GitHub 并发触发多次）
function renderHookBadges() {
  const counts = new Map();
  activeRuns.forEach(r => counts.set(r.hookId, (counts.get(r.hookId) || 0) + 1));
  document.querySelectorAll('[data-hook-badge]').forEach(el => {
    const n = counts.get(el.dataset.hookBadge) || 0;
    el.style.display = n ? 'inline-block' : 'none';
    el.textContent = n ? (n > 1 ? `进行中 x${n}` : '进行中') : '';
    el.title = n ? '点击「日志」可查看进行中的执行' : '';
  });
}
function copySecret(id) {
  const h = hooks.find(x => x.id === id);
  if (!h || !h.secret) { toast('该 Hook 没有 Secret'); return; }
  copyText(h.secret);
}
// 面板常用 http 访问（非安全上下文），navigator.clipboard 不可用时走 execCommand 兜底
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(() => toast('已复制'), () => legacyCopy(t));
    return;
  }
  legacyCopy(t);
}
function legacyCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }
  ta.remove();
}

function openEditor(id) {
  const h = hooks.find(x => x.id === id) || {};
  $('#editorTitle').textContent = id ? '编辑 Hook · ' + id : '新建 Hook';
  $('#f_id').value = h.id || ''; $('#f_id').disabled = !!id;
  $('#f_path').value = h.projectPath || ''; $('#f_cmd').value = h.deployCmd || '';
  $('#f_mail').value = h.notifyMail || ''; $('#f_secret').value = '';
  $('#f_enabled').checked = id ? !!h.enabled : true;
  const sel = $('#f_target');
  sel.innerHTML = '<option value="0">本机（面板执行环境）</option>' +
    hosts.map(x => `<option value="${x.id}">主机 · ${esc(hostLabel(x.id))}</option>`).join('');
  if (h.sshHostId && !hosts.find(x => x.id === h.sshHostId)) {
    sel.innerHTML += `<option value="${h.sshHostId}">${esc(hostLabel(h.sshHostId))}，请重新选择</option>`;
  }
  sel.value = String(h.sshHostId || 0);
  $('#editorMask').classList.add('open');
}
function closeEditor() { $('#editorMask').classList.remove('open'); }

async function saveHook() {
  const target = +$('#f_target').value || 0;
  if (target > 0 && !hosts.find(h => h.id === target)) {
    toast('关联主机已删除或未配置 SSH 凭据，请重新选择执行主机'); $('#f_target').focus(); return;
  }
  const body = {
    id: $('#f_id').value.trim(), projectPath: $('#f_path').value.trim(),
    deployCmd: $('#f_cmd').value.trim(), notifyMail: $('#f_mail').value.trim(),
    sshHostId: target,
    secret: $('#f_secret').value.trim(), enabled: $('#f_enabled').checked,
  };
  const r = await api('/hooks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.error) { toast(r.error); return; }
  toast('已保存'); closeEditor(); loadAll();
}
async function delHook(id) {
  if (!confirm('删除 Hook ' + id + '？')) return;
  await api('/hooks/' + id, { method: 'DELETE' });
  toast('已删除'); loadAll(); pollActive();
}
async function toggleHook(id, enabled) {
  const h = hooks.find(x => x.id === id);
  await api('/hooks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...h, enabled }) });
  loadAll();
}

// ---- 执行 ----

async function runHook(id) {
  if (activeRuns.some(x => x.hookId === id)) { toast('该 Hook 已有执行在进行中，请等完成后再试'); return; }
  toast('已触发执行');
  const r = await api('/hooks/' + id + '/run', { method: 'POST' });
  if (r.error) { toast('执行失败: ' + r.error); return; }
  pollActive();
  showLogs(id);
  openLiveRun(r.runId, id, r.startAt, r.target);
}

// 同步进行中执行（仅用于 Hook 卡片徽标和日志列表刷新）
async function pollActive() {
  try {
    const list = await api('/active');
    const prev = lastActive;
    activeRuns = Array.isArray(list) ? list : [];
    lastActive = activeRuns;
    renderHookBadges();
    // 执行刚结束：刷新已经打开的历史列表，让“运行中”行立刻变成结果行
    prev.forEach(p => {
      if (!activeRuns.some(x => x.runId === p.runId)) {
        const box = $('#logs-' + p.hookId);
        if (box && box.innerHTML.trim()) showLogs(p.hookId);
      }
    });
  } catch (e) { /* 瞬断忽略 */ }
}

// ---- 历史记录 ----

async function showLogs(id) {
  const box = $('#logs-' + id);
  if (!box) return;
  const logs = await api('/logs/' + id) || [];
  logsCache[id] = logs;
  if (!logs.length) { box.innerHTML = '<div class="meta">暂无执行记录</div>'; return; }
  box.innerHTML = `
    <table class="logs">
      <tr><th>时间</th><th>目标</th><th>退出码</th><th>用时</th><th>操作</th></tr>
      ${logs.map((l, i) => `<tr>
        <td>${esc(l.startAt)}</td>
        <td>${targetLabel(l.target)}</td>
        <td class="${l.status === 'running' ? '' : (l.exitCode === 0 ? 'ok' : 'fail')}">${l.status === 'running' ? '<span class="badge running">运行中</span>' : esc(l.exitCode)}</td>
        <td>${l.durationMs ? fmtDur(l.durationMs) : '—'}</td>
        <td><button class="btn small" onclick="openLogByIndex('${esc(id)}',${i})">${l.status === 'running' ? '实时查看' : '查看输出'}</button></td>
      </tr>`).join('')}
    </table>`;
}
function openLogByIndex(id, i) {
  const l = (logsCache[id] || [])[i];
  if (!l) return;
  if (l.status === 'running') return openLiveRun(l.runId, id, l.startAt, l.target);
  // 历史记录自带 output，直接展示；不再按 runId 回查内存（run 被淘汰后仍能看日志）
  stopLive();
  $('#logMask').classList.add('open');
  setLogHead(id, l.target, l.startAt);
  setLogStatus(l.status || (l.exitCode === 0 ? 'success' : 'failed'), l.exitCode);
  setLogText(l.output || '');
}

// ---- 实时日志弹窗 ----

function setLogHead(hookId, target, startAt) {
  $('#logTitle').textContent = '执行日志 · ' + hookId;
  $('#logMeta').innerHTML = '目标 ' + targetLabel(target) + (startAt ? ' · 开始 ' + esc(startAt) : '');
}
function setLogStatus(status, exitCode) {
  const b = $('#logStatus');
  const cls = status === 'success' ? 'success' : status === 'timeout' ? 'timeout' : status === 'failed' ? 'failed' : 'running';
  b.className = 'badge ' + cls;
  b.textContent = (STATUS_TEXT[status] || '运行中') + (status !== 'running' && exitCode != null && exitCode >= 0 ? ' · exit ' + exitCode : '');
}
function nearBottom(pre) { return pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60; }
function appendLog(text) {
  if (!text) return;
  const pre = $('#logPre');
  const stick = nearBottom(pre);
  pre.appendChild(document.createTextNode(text));
  if (stick) pre.scrollTop = pre.scrollHeight;
}
function setLogText(text) {
  const pre = $('#logPre');
  if (pre.textContent === text) return;
  const stick = nearBottom(pre);
  pre.textContent = text;
  if (stick) pre.scrollTop = pre.scrollHeight;
}

function openLiveRun(runId, hookId, startAt, target) {
  stopLive();
  $('#logMask').classList.add('open');
  $('#logPre').textContent = '';
  setLogHead(hookId, target, startAt);
  setLogStatus('running');
  $('#logHint').textContent = '连接实时输出…';
  live = { runId: runId, hookId: hookId, startedMs: sinceOf(startAt), es: null, pollTimer: null, pollMode: false };
  $('#logDur').textContent = '已运行 ' + fmtDur(Date.now() - live.startedMs);
  connectStream(live);
}
function connectStream(w) {
  if (typeof EventSource === 'undefined') { startPolling(w, '浏览器不支持实时推送，已切换轮询'); return; }
  let es;
  try {
    es = new EventSource('/api/plugin/webhooks/runs/' + encodeURIComponent(w.runId) + '/stream');
  } catch (e) { startPolling(w, '实时连接创建失败，已切换轮询'); return; }
  w.es = es;
  let got = false;
  const first = setTimeout(() => { if (live === w && !got) startPolling(w, '等待输出，已切换轮询'); }, 4000);
  es.onmessage = (ev) => {
    if (live !== w) { es.close(); return; }
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'out') {
      got = true; clearTimeout(first);
      appendLog((msg.data && msg.data.text) || '');
      $('#logHint').textContent = '实时输出中…';
    } else if (msg.type === 'done') {
      clearTimeout(first);
      try { es.close(); } catch (e) {}
      w.es = null;
      finishLive(w, msg.data || {});
    }
  };
  es.onerror = () => {
    clearTimeout(first);
    if (live === w) startPolling(w);
  };
}
// SSE 不可用（反代缓冲/断开）时降级为 800ms 轮询，接口返回全量输出直接替换
function startPolling(w, hint) {
  if (live !== w || w.pollMode) return;
  w.pollMode = true;
  if (w.es) { try { w.es.close(); } catch (e) {} w.es = null; }
  $('#logHint').textContent = hint || '实时连接中断，已切换轮询';
  const tick = async () => {
    if (live !== w) return;
    try {
      const r = await api('/runs/' + w.runId);
      if (live !== w) return;
      if (r.error) {
        $('#logHint').textContent = r.error;
      } else {
        setLogText(r.output || '');
        if (r.status !== 'running') { finishLive(w, r); return; }
      }
    } catch (e) { /* 下次再试 */ }
    if (live === w) w.pollTimer = setTimeout(tick, 800);
  };
  w.pollTimer = setTimeout(tick, 200);
}
function finishLive(w, info) {
  if (live !== w) return;
  stopLive();
  const st = info.status || 'success';
  setLogStatus(st, info.exitCode);
  $('#logDur').textContent = info.durationMs ? '用时 ' + fmtDur(info.durationMs) : '';
  $('#logHint').textContent = st === 'success' ? '执行完成' : '执行结束（' + (STATUS_TEXT[st] || st) + '）';
  if (w.hookId) showLogs(w.hookId);
  pollActive();
}
function stopLive() {
  if (!live) return;
  if (live.es) { try { live.es.close(); } catch (e) {} }
  if (live.pollTimer) clearTimeout(live.pollTimer);
  live = null;
}
function closeRunLog() { stopLive(); $('#logMask').classList.remove('open'); }

// 每秒刷新实时日志的运行时长
setInterval(() => {
  if (live) $('#logDur').textContent = '已运行 ' + fmtDur(Date.now() - live.startedMs);
}, 1000);
setInterval(pollActive, 2500);

loadAll();
pollActive();
</script>
