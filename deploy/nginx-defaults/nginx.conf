# ZJPanel 默认 nginx.conf（单容器：面板反代 compose 服务、证书挑战转发）
# 站点 conf 放 sites-available/ 并软链到 sites-enabled/（由面板管理）

user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ZJPanel 日志格式（带站点名，供请求地图解析；兼容 combined 解析）
    log_format zjp '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" srv=$server_name';

    access_log  /var/log/nginx/access.log zjp;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 512m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 反向代理常用头（站点 conf 中按需覆盖）
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
